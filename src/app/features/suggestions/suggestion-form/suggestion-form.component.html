<div class="container my-5">
  <div class="card shadow-sm p-4">
    <h2 class="mb-4 text-center">Ajouter une Suggestion</h2>

    <form [formGroup]="form" (ngSubmit)="submitForm()">

      <!-- Titre -->
      <div class="mb-3">
        <label for="title" class="form-label">Titre <span class="text-danger">*</span></label>
        <input id="title" type="text" class="form-control" placeholder="Entrez le titre" formControlName="title">
        <div class="invalid-feedback d-block" *ngIf="form.controls['title'].invalid && form.controls['title'].touched">
          <div *ngIf="form.controls['title'].errors?.['required']">Le titre est obligatoire.</div>
          <div *ngIf="form.controls['title'].errors?.['minlength']">Minimum 5 caractères.</div>
          <div *ngIf="form.controls['title'].errors?.['pattern']">Doit commencer par une majuscule.</div>
        </div>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
        <textarea id="description" rows="5" class="form-control" placeholder="Décrivez votre suggestion en détail..." formControlName="description"></textarea>
        <div class="invalid-feedback d-block" *ngIf="form.controls['description'].invalid && form.controls['description'].touched">
          <div *ngIf="form.controls['description'].errors?.['required']">Description obligatoire.</div>
          <div *ngIf="form.controls['description'].errors?.['minlength']">Minimum 30 caractères.</div>
        </div>
      </div>

      <!-- Catégorie -->
      <div class="mb-3">
        <label for="category" class="form-label">Catégorie <span class="text-danger">*</span></label>
        <select id="category" class="form-select" formControlName="category">
          <option value="">-- Sélectionnez une catégorie --</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="form.controls['category'].invalid && form.controls['category'].touched">
          La catégorie est obligatoire.
        </div>
      </div>

      <!-- Date -->
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input id="date" type="text" class="form-control" formControlName="date" readonly>
      </div>

      <!-- Status -->
      <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <input id="status" type="text" class="form-control" formControlName="status" readonly>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between align-items-center mt-4">
        <button type="submit" class="btn btn-success" [disabled]="form.invalid">
          <i class="bi bi-check-circle me-2"></i> Soumettre
        </button>
        <button type="button" class="btn btn-secondary" (click)="form.reset()">
          <i class="bi bi-x-circle me-2"></i> Réinitialiser
        </button>
      </div>

    </form>
  </div>
</div>
